# Configuración del Preprocessor para el dataset ATUS 2024.
#
# Define qué columnas se excluyen del modelo y cómo se transforma
# cada grupo de variables. Modifica este archivo si agregas, eliminas
# o reclasificas variables sin necesidad de tocar el código fuente.
#
# Grupos de transformación:
#   numeric    -> SimpleImputer(mediana) + StandardScaler
#   binary     -> passthrough (sin transformación)
#   categorical -> OneHotEncoder(drop='first')
#   cyclic     -> encoding seno/coseno; especifica el periodo de cada variable

# Columnas a excluir del modelo antes de cualquier transformación
exclude_columns:
  - ID_MINUTO       # Granularidad excesiva
  - ID_DIA          # Sin relación causal con la severidad
  - NOM_MUN         # Cardinalidad demasiado alta (1,435 categorías)
  - TRANVIA         # Prácticamente sin variación
  - FERROCARRI      # Prácticamente sin variación
  - OTROVEHIC       # Prácticamente sin variación
  - TOTAL_MUERTOS   # Data leakage
  - CONDMUERTO      # Data leakage — consecuencia del accidente
  - CONDHERIDO      # Data leakage — consecuencia del accidente
  - PASAMUERTO      # Data leakage — consecuencia del accidente
  - PASAHERIDO      # Data leakage — consecuencia del accidente
  - PEATMUERTO      # Data leakage — consecuencia del accidente
  - PEATHERIDO      # Data leakage — consecuencia del accidente
  - CICLMUERTO      # Data leakage — consecuencia del accidente
  - CICLHERIDO      # Data leakage — consecuencia del accidente
  - OTROMUERTO      # Data leakage — consecuencia del accidente
  - OTROHERIDO      # Data leakage — consecuencia del accidente

# Variables numéricas continuas
# Transformación: SimpleImputer(strategy='median') -> StandardScaler
numeric_columns:
  - ID_EDAD
  - AUTOMOVIL
  - CAMPASAJ
  - MICROBUS
  - PASCAMION
  - OMNIBUS
  - CAMIONETA
  - CAMION
  - TRACTOR
  - MOTOCICLET
  - BICICLETA

# Variables binarias (0/1)
# Transformación: passthrough
binary_columns:
  - CONDUCTOR_FUGADO
  - EDAD_DESCONOCIDA

# Variables categóricas nominales
# Transformación: OneHotEncoder(drop='first', handle_unknown='ignore')
categorical_columns:
  - DIASEMANA
  - URBANA
  - SUBURBANA
  - TIPACCID
  - CAUSAACCI
  - CAPAROD
  - SEXO
  - ALIENTO
  - CINTURON
  - NOM_ENT

# Variables temporales cíclicas
# Transformación: encoding seno/coseno
# period: valor máximo de la variable (12 para meses, 24 para horas)
cyclic_columns:
  - name: MES
    period: 12
  - name: ID_HORA
    period: 24
