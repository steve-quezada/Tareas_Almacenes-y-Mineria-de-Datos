# repository_config.yaml
# ======================
# Configuración del DataRepository para el dataset ATUS 2024 limpio.
#
# target_column: variable objetivo del modelo supervisado. Se usa en
# el resumen del dataset y puede consultarse desde cualquier clase
# del pipeline mediante repo.target_column.
#
# required_columns: lista de columnas mínimas que debe contener el
# dataset limpio para ser considerado válido. Si el CSV exportado
# desde el notebook de limpieza no contiene alguna de estas columnas,
# DataRepository lanzará un ValueError con el detalle del problema.
#
# Modifica este archivo si agregas o eliminas columnas en la limpieza del dataset.

target_column: CLASACC

required_columns:
  # Variable objetivo
  - CLASACC

  # Características del accidente
  - TIPACCID
  - CAUSAACCI
  - URBANA
  - SUBURBANA
  - CAPAROD

  # Temporales
  - MES
  - DIASEMANA
  - ID_HORA

  # Características del conductor
  - SEXO
  - ID_EDAD
  - ALIENTO
  - CINTURON
  - CONDUCTOR_FUGADO
  - EDAD_DESCONOCIDA

  # Vehículos involucrados
  - AUTOMOVIL
  - MOTOCICLET
  - CAMIONETA
  - CAMION
  - MICROBUS
  - BICICLETA

  # Víctimas
  - CONDMUERTO
  - CONDHERIDO
  - PASAMUERTO
  - PASAHERIDO
  - PEATMUERTO
  - PEATHERIDO
  - CICLMUERTO
  - CICLHERIDO
  - OTROMUERTO
  - OTROHERIDO

  # Geográficas
  - NOM_ENT
  - NOM_MUN
