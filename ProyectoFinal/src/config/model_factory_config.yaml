# Configuración de hiperparámetros base para cada modelo disponible
# en ModelFactory. Modifica este archivo para ajustar los parámetros
# iniciales sin tocar el código fuente.
#
# Notas:
#   - random_state debe coincidir con RANDOM_STATE del notebook
#   - class_weight: balanced compensa el desbalance severo de CLASACC
#   - n_jobs: -1 usa todos los núcleos disponibles
#   - null en YAML equivale a None en Python

dummy:
  strategy: most_frequent

logistic_regression:
  max_iter: 1000
  class_weight: balanced
  random_state: 42
  n_jobs: -1
  solver: lbfgs

random_forest:
  n_estimators: 100
  max_depth: null
  min_samples_split: 2
  min_samples_leaf: 1
  class_weight: balanced
  random_state: 42
  n_jobs: -1

xgboost:
  n_estimators: 100
  max_depth: 6
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  use_label_encoder: false
  eval_metric: mlogloss
  random_state: 42
  n_jobs: -1
